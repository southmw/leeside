<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LEESIDE</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1a17;
        color: #e8dcc0;
        font-family: system-ui, "Malgun Gothic", sans-serif;
      }
      #app {
        height: 100%;
        display: grid;
        place-items: center;
        font-size: clamp(40px, 7vw, 96px);
        font-weight: 600;
        letter-spacing: 0.3em;
        /* Letter-spacing adds a trailing gap; pad the left side so the word stays centred. */
        padding-left: 0.3em;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
